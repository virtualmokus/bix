<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIX — Budapest Internet Exchange data view</title>
<meta name="description" content="Independent visual data view of the Budapest Internet Exchange, built from public sources.">
<!-- Minden erőforrás helyben. Külső CDN-t szándékosan nem hívunk: az minden
     látogató IP-címét elküldené egy harmadik félnek, cserébe semmiért. -->
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/vendor/leaflet.css">
<script src="assets/vendor/leaflet.js" defer></script>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/interactive.css">
<link rel="stylesheet" href="assets/emphasis.css">
<link rel="stylesheet" href="assets/typography.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">BIX</span>
      <span class="brand-tagline" data-str="siteTagline"></span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="overview" aria-selected="true"></button>
      <button class="tab" role="tab" data-view="members" aria-selected="false"></button>
      <button class="tab" role="tab" data-view="map" aria-selected="false"></button>
      <button class="tab" role="tab" data-view="legal" aria-selected="false"></button>
    </nav>
    <div class="lang-switch" id="lang-switch" role="group" aria-label="Language"></div>
    <span class="live-badge" id="live-badge"></span>
  </header>

  <main id="view" class="view"></main>

  <footer class="site-footer" id="footer"></footer>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
