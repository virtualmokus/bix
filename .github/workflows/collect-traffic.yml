name: Forgalmi gyűjtés

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Szándékosan nem a workflow neve: a napi gyűjtés ugyanezt a csoportot
# használja, így a két workflow soha nem ír egyszerre a repóba.
concurrency:
  group: bix-data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Mintavétel
        run: node collect/traffic.js

      - name: Commit
        run: |
          git config user.name  "bix-collector"
          git config user.email "bix-collector@users.noreply.github.com"
          git add data/traffic.csv data/meta.json
          git diff --staged --quiet && exit 0
          git commit -m "data: forgalmi mintavétel"
          git pull --rebase --autostash
          git push
