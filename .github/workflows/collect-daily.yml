name: Napi szerkezeti gyűjtés

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bix-data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      # A két gyűjtő continue-on-error-ral fut: az egyik forrás kiesése
      # nem akadályozza meg a másikat, sem az összefésülést a meglévő
      # adaton. A hiba viszont az utolsó lépésben pirosra váltja a futást.
      - id: ports
        name: Port-tábla
        run: node collect/ports.js
        continue-on-error: true

      - id: peeringdb
        name: PeeringDB
        run: node collect/peeringdb.js
        continue-on-error: true

      # Az első merge állítja elő a members.json-t, amiből a hálózati gyűjtő
      # az ASN-listát veszi; a második fésüli rá a kapott profilokat.
      - name: Összefésülés
        run: node collect/merge.js

      - id: networks
        name: Hálózati profilok
        run: node collect/networks.js
        continue-on-error: true

      - name: Összefésülés a profilokkal
        run: node collect/merge.js

      - id: global
        name: Globális IXP-térkép
        run: node collect/global.js
        continue-on-error: true

      # A tengeralatti kábelek lassan változnak, a fájl viszont nagy — ezért
      # csak akkor frissítjük, ha a globális réteg is elkészült.
      - id: cables
        name: Tengeralatti kábelek
        run: node collect/cables.js
        continue-on-error: true

      - name: Commit
        run: |
          git config user.name  "bix-collector"
          git config user.email "bix-collector@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "data: napi szerkezeti gyűjtés"
          git pull --rebase --autostash
          git push

      - name: Hibás forrás jelzése
        if: steps.ports.outcome == 'failure' || steps.peeringdb.outcome == 'failure' || steps.networks.outcome == 'failure' || steps.global.outcome == 'failure' || steps.cables.outcome == 'failure'
        run: |
          echo "Legalább egy forrás hibázott. Részletek a data/meta.json last_error mezőiben."
          exit 1
